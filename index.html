<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>诚恳道歉 | 这次是我错了</title>
    <!-- 使用更清爽的字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #d4eaf7 0%, #b8d8fc 50%, #7bb3db 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            padding: 20px;
            position: relative;
        }

        /* 几何装饰背景 - 简洁不可爱 */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 2px, transparent 2px, transparent 8px),
                repeating-linear-gradient(135deg, rgba(60,80,100,0.02) 0px, rgba(60,80,100,0.02) 1px, transparent 1px, transparent 12px);
            pointer-events: none;
            z-index: 0;
        }

        /* 主卡片 - 冷色调，棱角分明一点 */
        .apology-card {
            max-width: 580px;
            width: 100%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            padding: 36px 32px 44px;
            text-align: center;
            transition: all 0.2s ease;
            animation: slideUp 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(72, 120, 160, 0.2);
            position: relative;
            z-index: 2;
        }

        @keyframes slideUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 简洁标题 */
        .title {
            font-family: 'Space Grotesk', 'Inter', sans-serif;
            font-size: 2.4rem;
            font-weight: 700;
            color: #1e4a6b;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .title .icon {
            font-size: 2rem;
            filter: none;
        }

        .sub {
            font-size: 0.9rem;
            font-weight: 500;
            background: #e6f0f9;
            display: inline-block;
            padding: 5px 16px;
            border-radius: 40px;
            color: #2c6285;
            margin-bottom: 28px;
            letter-spacing: 0.3px;
            border: 1px solid #caddf0;
        }

        /* 道歉信息区域 - 干净利落 */
        .message-box {
            background: #f5faff;
            border-radius: 24px;
            padding: 24px 22px;
            margin: 12px 0 20px;
            border: 1px solid #cfe2f5;
            transition: 0.2s;
        }

        .message-box p {
            font-size: 1rem;
            line-height: 1.55;
            color: #2c3e4e;
            font-weight: 500;
            margin-bottom: 12px;
        }

        .message-box .highlight {
            background: #e2effa;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
            color: #1a5d84;
            display: inline-block;
        }

        .quote-line {
            font-size: 1rem;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 2px solid #d4e3f5;
            font-weight: 600;
            color: #2c6285;
            letter-spacing: 0.3px;
        }

        /* ========= 修改区域：可爱可动元素样式 ========= */
        .cute-pattern-area {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin: 20px 0 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .cute-item {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: default;
            transition: all 0.2s ease;
            animation: floatSoft 2s infinite ease-in-out;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
        }

        /* 每个小动物不同的动画延迟，让节奏错落可爱 */
        .cute-item:nth-child(1) { animation-delay: 0s; animation-duration: 1.8s; }
        .cute-item:nth-child(2) { animation-delay: 0.3s; animation-duration: 2.2s; }
        .cute-item:nth-child(3) { animation-delay: 0.6s; animation-duration: 2s; }
        .cute-item:nth-child(4) { animation-delay: 0.9s; animation-duration: 1.9s; }

        @keyframes floatSoft {
            0% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-8px) rotate(3deg);
            }
            100% {
                transform: translateY(0px) rotate(0deg);
            }
        }

        /* 悬浮微动 + 心跳效果（鼠标悬停时） */
        .cute-item:hover {
            animation: bounceHeart 0.4s ease-in-out;
            transform: scale(1.15);
        }

        @keyframes bounceHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* 旋转效果给特定元素增加动态 */
        .cute-item.spin-once:hover {
            animation: spinQuick 0.5s ease-out;
        }

        @keyframes spinQuick {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 按钮区域及其他保持不变 */
        .button-zone {
            margin: 28px 0 16px;
            display: flex;
            justify-content: center;
            gap: 24px;
            flex-wrap: wrap;
            position: relative;
            min-height: 70px;
        }

        .btn {
            border: none;
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
            letter-spacing: 0.3px;
        }

        .btn-forgive {
            background: #2c7cb6;
            color: white;
            border: none;
            box-shadow: 0 4px 0 #175d8a;
        }

        .btn-forgive:hover {
            transform: translateY(-2px);
            background: #3a8bc8;
            box-shadow: 0 6px 0 #175d8a;
        }

        .btn-forgive:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #175d8a;
        }

        .btn-runaway {
            background: #e2e8f0;
            color: #2c5a7a;
            border: 1px solid #cbdde9;
            box-shadow: 0 3px 0 #b9c8d6;
        }

        .btn-runaway:hover {
            background: #d0dbe8;
        }

        .attempt-counter {
            margin-top: 18px;
            background: #ecf3f9;
            border-radius: 40px;
            padding: 6px 16px;
            display: inline-block;
            font-weight: 500;
            font-size: 0.8rem;
            color: #2c6285;
            font-family: monospace;
            letter-spacing: 0.3px;
        }

        footer {
            margin-top: 28px;
            font-size: 0.7rem;
            color: #5f8aaa;
            opacity: 0.7;
        }

        .success-area {
            background: #eef5fc;
            border-radius: 32px;
            padding: 32px 28px;
            margin: 0 auto;
            text-align: center;
            border: 1px solid #bfdaf0;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.08);
            animation: fadeInUp 0.4s ease;
            max-width: 580px;
            width: 100%;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .success-area h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            color: #1e6a5e;
            margin: 12px 0 8px;
        }

        .success-area p {
            color: #2c5a6e;
            font-weight: 500;
        }

        .badge-count {
            background: #d4e3f5;
            border-radius: 30px;
            padding: 5px 14px;
            font-size: 0.85rem;
            display: inline-block;
            margin-top: 16px;
        }

        .reset-btn {
            background: #2c7cb6;
            border: none;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            color: white;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .reset-btn:hover {
            background: #1e6a9b;
            transform: scale(0.98);
        }

        .hidden {
            display: none;
        }

        @media (max-width: 550px) {
            .apology-card {
                padding: 24px 20px 32px;
            }
            .title {
                font-size: 1.8rem;
            }
            .btn {
                font-size: 0.95rem;
                padding: 10px 22px;
            }
            .cute-item {
                width: 42px;
                height: 42px;
                font-size: 1.6rem;
            }
            .cute-pattern-area {
                gap: 16px;
            }
        }
    </style>
</head>
<body>

<div class="apology-card" id="apologyCard">
    <div class="title">
        <span class="icon">⚡</span> 抱歉 <span class="icon">◆</span>
    </div>
    <div class="sub">诚恳致歉 · 绝无下次</div>

    <div class="message-box">
        <p>亲爱的老哥：</p>
        <p>我真的知道错了，<span class="highlight">对不起啦</span>。<br>
        让你感到不舒服或者失望，真的过意不去。</p>
        <p>这几天我一直在反思自己，我不该无缘无故发脾气的，真的只是太害怕你会不跟我玩了。<br>
        希望您大人不记小人过，别跟我这小屁孩一般见识啦。</p>
        <div class="quote-line">→ 接受这份道歉，咱们还是好朋友 ←</div>
    </div>

    <!-- 修改区域：可爱的可动元素，替代原来的简约几何图案 -->
    <div class="cute-pattern-area">
        <div class="cute-item" id="cutePanda">🐼</div>
        <div class="cute-item" id="cuteBear">🐻‍❄️</div>
        <div class="cute-item" id="cuteRabbit">🐰</div>
        <div class="cute-item" id="cuteStar">✨</div>
    </div>

    <div class="button-zone" id="buttonZone">
        <button class="btn btn-forgive" id="forgiveBtn">✓ 接受道歉</button>
        <button class="btn btn-runaway" id="runawayBtn">✗ 不太满意</button>
    </div>

    <div class="attempt-counter" id="counterBox">
        被拒绝了 <span id="attemptCount">0</span> 次 · 但我态度依旧诚恳
    </div>
    <footer>· 点击「接受道歉」解锁诚意 · 点「不太满意」我会更认真的 ·</footer>
</div>

<!-- 成功面板 -->
<div id="successPanel" class="success-area hidden">
    <div style="font-size: 2.8rem;">🤝 ✓</div>
    <h2>感谢原谅</h2>
    <p>我就知道老哥最好了，爱你。</p>
    <div class="badge-count" id="finalCountMsg"></div>
    <button class="reset-btn" id="resetBtn">⟳ 重新来过</button>
</div>

<script>
    (function(){
        // DOM 元素
        const card = document.getElementById('apologyCard');
        const successPanel = document.getElementById('successPanel');
        const forgiveBtn = document.getElementById('forgiveBtn');
        const runawayBtn = document.getElementById('runawayBtn');
        const counterSpan = document.getElementById('attemptCount');
        const buttonZone = document.getElementById('buttonZone');
        const counterBox = document.getElementById('counterBox');

        // 获取可爱元素，增加额外互动（点击小动物也会轻微表达歉意互动）
        const cuteItems = document.querySelectorAll('.cute-item');
        
        let rejectCount = 0;           // 拒绝次数
        let forgiven = false;          // 是否已经原谅/接受道歉
        let originalLeft = null;
        let originalTop = null;
        
        // 存储按钮原始位置信息 (相对父容器)
        function storeOriginalPosition() {
            if(!runawayBtn || !buttonZone) return;
            const parentStyle = getComputedStyle(buttonZone);
            if(parentStyle.position !== 'relative' && parentStyle.position !== 'absolute') {
                buttonZone.style.position = 'relative';
            }
            let leftVal = runawayBtn.style.left;
            let topVal = runawayBtn.style.top;
            if(!leftVal || leftVal === 'auto' || leftVal === '') {
                const offsetLeft = runawayBtn.offsetLeft;
                const offsetTop = runawayBtn.offsetTop;
                originalLeft = offsetLeft;
                originalTop = offsetTop;
                runawayBtn.style.position = 'relative';
                runawayBtn.style.left = offsetLeft + 'px';
                runawayBtn.style.top = offsetTop + 'px';
            } else {
                originalLeft = parseFloat(leftVal);
                originalTop = parseFloat(topVal);
            }
        }
        
        function resetButtonPosition() {
            if(!runawayBtn || forgiven) return;
            if(originalLeft !== null && originalTop !== null) {
                runawayBtn.style.left = originalLeft + 'px';
                runawayBtn.style.top = originalTop + 'px';
                runawayBtn.style.position = 'relative';
            } else {
                runawayBtn.style.position = 'relative';
                runawayBtn.style.left = '0px';
                runawayBtn.style.top = '0px';
            }
            runawayBtn.style.display = 'inline-flex';
            runawayBtn.style.opacity = '1';
            runawayBtn.disabled = false;
            runawayBtn.style.cursor = 'pointer';
        }
        
        function moveRunawayButton(useMouse = false, mouseX = null, mouseY = null) {
            if(forgiven) return;
            if(!runawayBtn || !buttonZone) return;
            const parentRect = buttonZone.getBoundingClientRect();
            const btnRect = runawayBtn.getBoundingClientRect();
            const btnWidth = btnRect.width;
            const btnHeight = btnRect.height;
            
            let currentLeft = parseFloat(runawayBtn.style.left);
            let currentTop = parseFloat(runawayBtn.style.top);
            if(isNaN(currentLeft)) currentLeft = 0;
            if(isNaN(currentTop)) currentTop = 0;
            
            const padding = 8;
            const maxLeft = parentRect.width - btnWidth - padding;
            const maxTop = parentRect.height - btnHeight - padding;
            const minLeft = padding;
            const minTop = padding;
            
            let newLeft, newTop;
            if(useMouse && mouseX && mouseY) {
                const mouseRelativeX = mouseX - parentRect.left;
                const mouseRelativeY = mouseY - parentRect.top;
                let dx = (currentLeft + btnWidth/2) - mouseRelativeX;
                let dy = (currentTop + btnHeight/2) - mouseRelativeY;
                if(Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) { dx = 1; dy = 0; }
                const len = Math.hypot(dx, dy);
                if(len > 0.01) {
                    dx = dx / len;
                    dy = dy / len;
                }
                const power = Math.min(85, 45 + rejectCount * 2.5);
                let moveX = dx * power + (Math.random() - 0.5) * 30;
                let moveY = dy * power + (Math.random() - 0.5) * 30;
                newLeft = currentLeft + moveX;
                newTop = currentTop + moveY;
            } else {
                newLeft = currentLeft + (Math.random() - 0.5) * 110;
                newTop = currentTop + (Math.random() - 0.5) * 80;
            }
            
            newLeft = Math.min(maxLeft, Math.max(minLeft, newLeft));
            newTop = Math.min(maxTop, Math.max(minLeft, newTop));
            
            runawayBtn.style.transition = 'left 0.09s ease-out, top 0.09s ease-out';
            runawayBtn.style.left = newLeft + 'px';
            runawayBtn.style.top = newTop + 'px';
            setTimeout(() => {
                if(runawayBtn) runawayBtn.style.transition = '';
            }, 100);
        }
        
        function onReject(event) {
            if(forgiven) return;
            rejectCount++;
            counterSpan.innerText = rejectCount;
            
            const quoteDiv = document.querySelector('.quote-line');
            if(rejectCount === 3) {
                if(quoteDiv) quoteDiv.innerHTML = '→ 被拒3次，我继续蹲守，再给次机会 →';
            } else if(rejectCount === 6) {
                if(quoteDiv) quoteDiv.innerHTML = '→ 第六次了… 手累了吧？但我真的知错了 →';
            } else if(rejectCount === 10) {
                if(quoteDiv) quoteDiv.innerHTML = '→ 拒绝10次成就达成，诚意可鉴，原谅我呗 →';
            } else if(rejectCount > 12) {
                if(quoteDiv && !quoteDiv.innerHTML.includes('耐力')) 
                    quoteDiv.innerHTML = '→ 耐力MAX，请收下这份道歉 →';
            }
            
            if(event && event.clientX) {
                moveRunawayButton(true, event.clientX, event.clientY);
            } else {
                moveRunawayButton(false);
            }
            
            const titleIcon = document.querySelector('.title');
            if(titleIcon) {
                titleIcon.style.transform = 'scale(0.98)';
                setTimeout(() => { if(titleIcon) titleIcon.style.transform = ''; }, 120);
            }

            // 增加可爱互动：拒绝时所有小动物晃动一下表示安慰
            cuteItems.forEach(item => {
                item.style.transform = 'scale(0.9)';
                setTimeout(() => { if(item) item.style.transform = ''; }, 150);
            });
        }
        
        function onHoverRunaway(e) {
            if(forgiven) return;
            if(!runawayBtn) return;
            if(e && e.clientX) {
                moveRunawayButton(true, e.clientX, e.clientY);
            } else {
                moveRunawayButton(false);
            }
            runawayBtn.style.transform = 'rotate(1deg)';
            setTimeout(() => { if(runawayBtn) runawayBtn.style.transform = ''; }, 100);
        }
        
        function onForgive() {
            if(forgiven) return;
            forgiven = true;
            
            buttonZone.style.display = 'none';
            if(counterBox) counterBox.style.display = 'none';
            card.style.display = 'none';
            
            successPanel.classList.remove('hidden');
            
            const finalMsgSpan = document.getElementById('finalCountMsg');
            if(finalMsgSpan) {
                if(rejectCount === 0) {
                    finalMsgSpan.innerHTML = '✓ 一次就通过，感谢你的爽快！';
                } else {
                    finalMsgSpan.innerHTML = `📌 被拒绝 ${rejectCount} 次，依然等到你的谅解 · 说到做到`;
                }
            }
            
            createSimpleEffect();
            document.title = '感谢谅解 | 说到做到';
        }
        
        function createSimpleEffect() {
            const colors = ['#2c7cb6', '#5f9dc9', '#87b9df', '#c0dcf5'];
            for(let i = 0; i < 45; i++) {
                const particle = document.createElement('div');
                particle.textContent = '•';
                particle.style.position = 'fixed';
                particle.style.left = Math.random() * window.innerWidth + 'px';
                particle.style.top = window.innerHeight - 30 + 'px';
                particle.style.fontSize = (14 + Math.random() * 22) + 'px';
                particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '9999';
                particle.style.opacity = '0.8';
                particle.style.transition = 'all 1s cubic-bezier(0.2, 0.9, 0.4, 1)';
                document.body.appendChild(particle);
                const randomX = (Math.random() - 0.5) * 200;
                const randomY = -Math.random() * 180 - 30;
                particle.style.transform = `translate(${randomX}px, ${randomY}px) rotate(${Math.random() * 90}deg)`;
                particle.style.opacity = '0';
                setTimeout(() => particle.remove(), 1000);
            }
        }
        
        function resetAll() {
            forgiven = false;
            rejectCount = 0;
            counterSpan.innerText = '0';
            
            card.style.display = 'block';
            successPanel.classList.add('hidden');
            buttonZone.style.display = 'flex';
            if(counterBox) counterBox.style.display = 'inline-block';
            
            if(runawayBtn) {
                runawayBtn.style.display = 'inline-flex';
                runawayBtn.disabled = false;
                resetButtonPosition();
            }
            
            const quoteDiv = document.querySelector('.quote-line');
            if(quoteDiv) quoteDiv.innerHTML = '→ 接受这份道歉，咱们还是好朋友 ←';
            
            const titleIcon = document.querySelector('.title');
            if(titleIcon) titleIcon.style.transform = '';
            
            document.title = '诚恳道歉 | 这次是我错了';
        }
        
        function bindEvents() {
            forgiveBtn.addEventListener('click', onForgive);
            runawayBtn.addEventListener('click', onReject);
            runawayBtn.addEventListener('mouseenter', onHoverRunaway);
            const resetBtn = document.getElementById('resetBtn');
            if(resetBtn) resetBtn.addEventListener('click', resetAll);
            
            // 给小动物增加可爱的点击特效（不干扰主要逻辑，单纯增加萌感）
            cuteItems.forEach(item => {
                item.addEventListener('click', () => {
                    if(!forgiven) {
                        item.style.transform = 'scale(1.2)';
                        setTimeout(() => { item.style.transform = ''; }, 200);
                        // 播放微妙的小提示，让道歉氛围更轻松
                        const tempMsg = document.createElement('div');
                        tempMsg.textContent = '🐣 原谅他吧～';
                        tempMsg.style.position = 'fixed';
                        tempMsg.style.bottom = '20px';
                        tempMsg.style.left = '50%';
                        tempMsg.style.transform = 'translateX(-50%)';
                        tempMsg.style.backgroundColor = 'rgba(44,124,182,0.9)';
                        tempMsg.style.color = 'white';
                        tempMsg.style.padding = '6px 14px';
                        tempMsg.style.borderRadius = '40px';
                        tempMsg.style.fontSize = '0.8rem';
                        tempMsg.style.zIndex = '1000';
                        tempMsg.style.fontWeight = '500';
                        tempMsg.style.pointerEvents = 'none';
                        document.body.appendChild(tempMsg);
                        setTimeout(() => tempMsg.remove(), 1000);
                    }
                });
            });
            
            window.addEventListener('resize', () => {
                if(!forgiven && runawayBtn && buttonZone) {
                    const parentRect = buttonZone.getBoundingClientRect();
                    const btnRect = runawayBtn.getBoundingClientRect();
                    let currentLeft = parseFloat(runawayBtn.style.left);
                    let currentTop = parseFloat(runawayBtn.style.top);
                    if(isNaN(currentLeft)) currentLeft = 0;
                    if(isNaN(currentTop)) currentTop = 0;
                    const maxLeft = parentRect.width - btnRect.width - 8;
                    const maxTop = parentRect.height - btnRect.height - 8;
                    let newLeft = Math.min(maxLeft, Math.max(8, currentLeft));
                    let newTop = Math.min(maxTop, Math.max(8, currentTop));
                    if(newLeft !== currentLeft || newTop !== currentTop) {
                        runawayBtn.style.left = newLeft + 'px';
                        runawayBtn.style.top = newTop + 'px';
                    }
                }
            });
        }
        
        function init() {
            if(buttonZone && getComputedStyle(buttonZone).position !== 'relative') {
                buttonZone.style.position = 'relative';
            }
            storeOriginalPosition();
            resetButtonPosition();
            bindEvents();
            setTimeout(() => {
                if(runawayBtn && !forgiven) {
                    moveRunawayButton(false);
                }
            }, 300);
        }
        
        init();
    })();
</script>
</body>
</html>
